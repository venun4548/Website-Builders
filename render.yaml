services:
  - type: web
    name: website-builders
    runtime: python
    buildCommand: pip install -r website-builders/backend/requirements.txt
    startCommand: cd website-builders/backend && gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: RENDER
        value: "true"
      - key: PYTHON_VERSION
        value: 3.11.0
