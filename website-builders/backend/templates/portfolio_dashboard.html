{% extends "layout.html" %}
{% block content %}
<div class="container mx-auto p-4">
    <h1 class="text-2xl font-bold mb-4">Portfolio Management</h1>
    
    <div class="bg-white p-4 rounded shadow mb-6">
        <h2 class="text-xl mb-2">Add Portfolio Item</h2>
        <form id="portfolioForm" class="space-y-4">
            <div><label>Title</label><input type="text" id="ptTitle" class="border p-2 w-full" required></div>
            <div><label>Description</label><textarea id="ptDesc" class="border p-2 w-full"></textarea></div>
            <div><label>Image URL</label><input type="text" id="ptImage" class="border p-2 w-full"></div>
            <div><label>Link</label><input type="text" id="ptLink" class="border p-2 w-full"></div>
            <div><label>Category</label><input type="text" id="ptCategory" class="border p-2 w-full"></div>
            <div><label>Sort Order</label><input type="number" id="ptSortOrder" class="border p-2 w-full" value="0"></div>
            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded">Add Item</button>
        </form>
    </div>

    <div class="bg-white p-4 rounded shadow">
        <h2 class="text-xl mb-2">Current Portfolio</h2>
        <table class="w-full text-left border-collapse">
            <thead>
                <tr>
                    <th class="border-b p-2">Title</th>
                    <th class="border-b p-2">Category</th>
                    <th class="border-b p-2">Link</th>
                    <th class="border-b p-2">Order</th>
                </tr>
            </thead>
            <tbody id="ptTableBody">
                <!-- Data populated by JS -->
            </tbody>
        </table>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    fetchPortfolio();

    document.getElementById('portfolioForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const data = {
            title: document.getElementById('ptTitle').value,
            desc: document.getElementById('ptDesc').value,
            image: document.getElementById('ptImage').value,
            link: document.getElementById('ptLink').value,
            category: document.getElementById('ptCategory').value,
            sort_order: parseInt(document.getElementById('ptSortOrder').value || 0)
        };

        const res = await fetch('/api/portfolio', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        });
        if(res.ok) {
            e.target.reset();
            fetchPortfolio();
        } else {
            alert('Error creating portfolio item');
        }
    });
});

async function fetchPortfolio() {
    const res = await fetch('/api/portfolio');
    const data = await res.json();
    const tbody = document.getElementById('ptTableBody');
    tbody.innerHTML = '';
    
    if (data && data.length > 0) {
        data.forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="border-b p-2">${item.title}</td>
                <td class="border-b p-2">${item.category}</td>
                <td class="border-b p-2"><a href="${item.link}" target="_blank" class="text-blue-500 underline">Link</a></td>
                <td class="border-b p-2">${item.sort_order}</td>
            `;
            tbody.appendChild(tr);
        });
    } else {
        tbody.innerHTML = '<tr><td colspan="4" class="p-2 text-center text-gray-500">No items found.</td></tr>';
    }
}
</script>
{% endblock %}
