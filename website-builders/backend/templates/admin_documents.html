{% extends "layout.html" %}
{% block content %}
<div class="container mx-auto py-8 px-4" x-data="documentDashboard()">
    <!-- Header Area -->
    <div class="flex justify-between items-center mb-8 bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
        <div>
            <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-indigo-600">Documents & Signatures</h1>
            <p class="text-gray-500 mt-2">Manage electronic signatures, agreements, and templates.</p>
        </div>
        <div class="flex gap-4">
            <button @click="loadDocuments()" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg transition-colors font-medium flex items-center gap-2">
                <i class="fas fa-sync-alt" :class="{'animate-spin': loading}"></i> Refresh
            </button>
            <a href="/admin/documents/create" class="px-5 py-2.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white rounded-lg transition-all shadow-md hover:shadow-lg font-medium flex items-center gap-2">
                <i class="fas fa-plus"></i> Create Document
            </a>
        </div>
    </div>

    <!-- Search and Filters -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-6 flex gap-4">
        <div class="relative flex-1">
            <i class="fas fa-search absolute left-3 top-3.5 text-gray-400"></i>
            <input type="text" x-model="search" placeholder="Search by title, client, or number..." class="w-full pl-10 pr-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all outline-none">
        </div>
        <select x-model="statusFilter" class="px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all outline-none">
            <option value="">All Statuses</option>
            <option value="DRAFT">Draft</option>
            <option value="PENDING_SIGNATURE">Pending Signature</option>
            <option value="VIEWED">Viewed</option>
            <option value="SIGNED">Signed</option>
            <option value="REJECTED">Rejected</option>
            <option value="CANCELLED">Cancelled</option>
        </select>
    </div>

    <!-- Loading State -->
    <div x-show="loading" class="flex flex-col items-center justify-center py-20 bg-white rounded-2xl shadow-sm border border-gray-100">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mb-4"></div>
        <p class="text-gray-500 font-medium">Loading documents...</p>
    </div>

    <!-- Document List -->
    <div x-show="!loading" class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
        <table class="w-full text-left border-collapse">
            <thead>
                <tr class="bg-gray-50/80 border-b border-gray-100">
                    <th class="py-4 px-6 font-semibold text-gray-600">Document</th>
                    <th class="py-4 px-6 font-semibold text-gray-600">Client</th>
                    <th class="py-4 px-6 font-semibold text-gray-600">Status</th>
                    <th class="py-4 px-6 font-semibold text-gray-600">Created</th>
                    <th class="py-4 px-6 font-semibold text-gray-600 text-right">Actions</th>
                </tr>
            </thead>
            <tbody>
                <template x-for="doc in filteredDocuments" :key="doc.document_id">
                    <tr class="border-b border-gray-50 hover:bg-gray-50/50 transition-colors group">
                        <td class="py-4 px-6">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-lg bg-blue-50 flex items-center justify-center text-blue-600">
                                    <i class="fas fa-file-contract"></i>
                                </div>
                                <div>
                                    <div class="font-medium text-gray-900" x-text="doc.title"></div>
                                    <div class="text-sm text-gray-500" x-text="doc.document_number"></div>
                                </div>
                            </div>
                        </td>
                        <td class="py-4 px-6">
                            <div class="font-medium text-gray-800" x-text="doc.client_name || 'N/A'"></div>
                            <div class="text-sm text-gray-500" x-text="doc.client_email || ''"></div>
                        </td>
                        <td class="py-4 px-6">
                            <span class="px-3 py-1 rounded-full text-xs font-semibold"
                                :class="{
                                    'bg-gray-100 text-gray-600': doc.status === 'DRAFT',
                                    'bg-yellow-100 text-yellow-700': doc.status === 'PENDING_SIGNATURE',
                                    'bg-blue-100 text-blue-700': doc.status === 'VIEWED',
                                    'bg-green-100 text-green-700': doc.status === 'SIGNED',
                                    'bg-red-100 text-red-700': doc.status === 'REJECTED' || doc.status === 'CANCELLED'
                                }" x-text="doc.status.replace('_', ' ')">
                            </span>
                        </td>
                        <td class="py-4 px-6 text-sm text-gray-500" x-text="formatDate(doc.created_at)"></td>
                        <td class="py-4 px-6 text-right">
                            <a :href="'/admin/documents/' + doc.document_id" class="inline-flex items-center justify-center w-8 h-8 rounded-lg text-gray-400 hover:text-blue-600 hover:bg-blue-50 transition-colors">
                                <i class="fas fa-arrow-right"></i>
                            </a>
                        </td>
                    </tr>
                </template>
                <tr x-show="filteredDocuments.length === 0">
                    <td colspan="5" class="py-12 text-center text-gray-500">
                        <div class="text-4xl mb-4 text-gray-300"><i class="fas fa-folder-open"></i></div>
                        <p class="font-medium">No documents found.</p>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
function documentDashboard() {
    return {
        documents: [],
        loading: true,
        search: '',
        statusFilter: '',
        
        init() {
            this.loadDocuments();
        },
        
        async loadDocuments() {
            this.loading = true;
            try {
                const res = await fetch('/api/admin/documents');
                const data = await res.json();
                if(data.success) {
                    this.documents = data.data || [];
                }
            } catch(e) {
                console.error('Failed to load docs', e);
                Swal.fire('Error', 'Failed to load documents.', 'error');
            } finally {
                this.loading = false;
            }
        },
        
        get filteredDocuments() {
            return this.documents.filter(d => {
                const matchesSearch = (d.title || '').toLowerCase().includes(this.search.toLowerCase()) || 
                                      (d.client_name || '').toLowerCase().includes(this.search.toLowerCase()) ||
                                      (d.document_number || '').toLowerCase().includes(this.search.toLowerCase());
                const matchesStatus = this.statusFilter === '' || d.status === this.statusFilter;
                return matchesSearch && matchesStatus;
            }).sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
        },
        
        formatDate(dateStr) {
            if(!dateStr) return '';
            try {
                const d = new Date(dateStr);
                return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
            } catch(e) {
                return dateStr;
            }
        }
    }
}
</script>
{% endblock %}
