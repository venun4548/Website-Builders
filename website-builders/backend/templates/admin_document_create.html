{% extends "layout.html" %}
{% block content %}
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<div class="container mx-auto py-8 px-4" x-data="documentCreate()">
    <div class="max-w-5xl mx-auto">
        <!-- Header -->
        <div class="flex justify-between items-center mb-6">
            <div>
                <a href="/admin/documents" class="text-blue-600 hover:underline mb-2 inline-block"><i class="fas fa-arrow-left"></i> Back to Documents</a>
                <h1 class="text-3xl font-bold text-gray-900">Create Agreement</h1>
            </div>
            <button @click="saveDocument()" :disabled="saving" class="px-6 py-2.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white rounded-lg transition-all shadow-md hover:shadow-lg font-medium flex items-center gap-2 disabled:opacity-50">
                <i class="fas fa-save" :class="{'animate-spin': saving}"></i> <span x-text="saving ? 'Saving...' : 'Save Draft'"></span>
            </button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Left: Metadata -->
            <div class="lg:col-span-1 space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                    <h2 class="text-lg font-semibold mb-4 text-gray-800">Document Details</h2>
                    
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Title</label>
                        <input type="text" x-model="doc.title" class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all outline-none" placeholder="e.g. Master Service Agreement">
                    </div>
                    
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Document Type</label>
                        <select x-model="doc.type" class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all outline-none">
                            <option value="Agreement">Agreement</option>
                            <option value="Contract">Contract</option>
                            <option value="Proposal">Proposal</option>
                            <option value="NDA">NDA</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Select Client</label>
                        <select x-model="selectedClientId" @change="onClientChange()" class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all outline-none">
                            <option value="">-- Choose Client --</option>
                            <template x-for="client in clients" :key="client.id">
                                <option :value="client.id" x-text="client.name + ' (' + client.email + ')'"></option>
                            </template>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Expires At (Optional)</label>
                        <input type="datetime-local" x-model="doc.expires_at" class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all outline-none">
                    </div>
                </div>

                <!-- Helper: Placeholders -->
                <div class="bg-blue-50 p-6 rounded-2xl shadow-sm border border-blue-100">
                    <h2 class="text-sm font-bold mb-3 text-blue-900 flex items-center gap-2"><i class="fas fa-magic"></i> Smart Placeholders</h2>
                    <p class="text-xs text-blue-700 mb-4">Click to insert into document.</p>
                    <div class="flex flex-wrap gap-2">
                        <button @click="insertPlaceholder('{{CLIENT_NAME}}')" class="px-2 py-1 bg-white border border-blue-200 text-blue-700 text-xs rounded hover:bg-blue-100 font-mono">{{CLIENT_NAME}}</button>
                        <button @click="insertPlaceholder('{{CLIENT_EMAIL}}')" class="px-2 py-1 bg-white border border-blue-200 text-blue-700 text-xs rounded hover:bg-blue-100 font-mono">{{CLIENT_EMAIL}}</button>
                        <button @click="insertPlaceholder('{{TODAY_DATE}}')" class="px-2 py-1 bg-white border border-blue-200 text-blue-700 text-xs rounded hover:bg-blue-100 font-mono">{{TODAY_DATE}}</button>
                    </div>
                </div>
            </div>

            <!-- Right: Editor -->
            <div class="lg:col-span-2">
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col h-full" style="min-height: 600px;">
                    <div id="toolbar-container" class="bg-gray-50 border-b border-gray-100 p-2">
                        <span class="ql-formats">
                            <select class="ql-header"></select>
                        </span>
                        <span class="ql-formats">
                            <button class="ql-bold"></button>
                            <button class="ql-italic"></button>
                            <button class="ql-underline"></button>
                        </span>
                        <span class="ql-formats">
                            <button class="ql-list" value="ordered"></button>
                            <button class="ql-list" value="bullet"></button>
                        </span>
                        <span class="ql-formats">
                            <select class="ql-align"></select>
                        </span>
                    </div>
                    <div id="editor-container" class="flex-1 p-6" style="font-size: 16px;">
                        <h1>Master Service Agreement</h1>
                        <p><br></p>
                        <p>This agreement is entered into on {{TODAY_DATE}} between Website Builders and {{CLIENT_NAME}}.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
<script>
function documentCreate() {
    return {
        quill: null,
        saving: false,
        clients: [],
        selectedClientId: '',
        doc: {
            title: '',
            type: 'Agreement',
            client_id: '',
            client_name: '',
            client_email: '',
            client_mobile: '',
            contentHtml: '',
            expires_at: ''
        },
        
        async init() {
            // Init Quill
            this.quill = new Quill('#editor-container', {
                modules: {
                    toolbar: '#toolbar-container'
                },
                theme: 'snow'
            });
            
            // Load clients
            try {
                const res = await fetch('/api/users');
                const data = await res.json();
                if(data.success && data.users) {
                    this.clients = data.users.filter(u => u.role === 'User').map(u => ({
                        id: u.id,
                        name: u.full_name,
                        email: u.email,
                        mobile: u.mobile
                    }));
                }
            } catch(e) { console.error('Failed to load clients', e); }
        },
        
        onClientChange() {
            const client = this.clients.find(c => c.id === this.selectedClientId);
            if(client) {
                this.doc.client_id = client.id;
                this.doc.client_name = client.name;
                this.doc.client_email = client.email;
                this.doc.client_mobile = client.mobile;
            } else {
                this.doc.client_id = '';
                this.doc.client_name = '';
                this.doc.client_email = '';
                this.doc.client_mobile = '';
            }
        },
        
        insertPlaceholder(text) {
            const range = this.quill.getSelection(true);
            this.quill.insertText(range.index, text);
        },
        
        processPlaceholders(html) {
            let processed = html;
            processed = processed.replace(/{{CLIENT_NAME}}/g, this.doc.client_name || '[Client Name]');
            processed = processed.replace(/{{CLIENT_EMAIL}}/g, this.doc.client_email || '[Client Email]');
            processed = processed.replace(/{{TODAY_DATE}}/g, new Date().toLocaleDateString());
            return processed;
        },
        
        async saveDocument() {
            if(!this.doc.title) {
                Swal.fire('Error', 'Please enter a document title.', 'error');
                return;
            }
            if(!this.doc.client_id) {
                Swal.fire('Error', 'Please select a client.', 'error');
                return;
            }
            
            this.saving = true;
            this.doc.contentHtml = this.processPlaceholders(this.quill.root.innerHTML);
            
            try {
                const res = await fetch('/api/admin/documents', {
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify(this.doc)
                });
                const data = await res.json();
                if(data.success) {
                    Swal.fire({
                        title: 'Success!',
                        text: 'Document draft created.',
                        icon: 'success',
                        timer: 2000,
                        showConfirmButton: false
                    }).then(() => {
                        window.location.href = `/admin/documents/${data.document_id || data.data.document_id}`;
                    });
                } else {
                    Swal.fire('Error', data.error || 'Failed to save', 'error');
                }
            } catch(e) {
                Swal.fire('Error', 'Network error', 'error');
            } finally {
                this.saving = false;
            }
        }
    }
}
</script>
<style>
.ql-container.ql-snow {
    border: none !important;
}
.ql-toolbar.ql-snow {
    border: none !important;
    border-bottom: 1px solid #e5e7eb !important;
}
.ql-editor {
    font-family: inherit;
}
</style>
{% endblock %}
