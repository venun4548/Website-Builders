{% extends "layout.html" %}
{% block content %}
<div class="container mx-auto p-4">
    <h1 class="text-2xl font-bold mb-4">Leads Management</h1>
    
    <div class="bg-white p-4 rounded shadow mb-6">
        <h2 class="text-xl mb-2">Create New Lead</h2>
        <form id="leadForm" class="space-y-4">
            <div><label>Name</label><input type="text" id="leadName" class="border p-2 w-full" required></div>
            <div><label>Email</label><input type="email" id="leadEmail" class="border p-2 w-full" required></div>
            <div><label>Phone</label><input type="text" id="leadPhone" class="border p-2 w-full"></div>
            <div><label>Company</label><input type="text" id="leadCompany" class="border p-2 w-full"></div>
            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded">Add Lead</button>
        </form>
    </div>

    <div class="bg-white p-4 rounded shadow">
        <h2 class="text-xl mb-2">Current Leads</h2>
        <table class="w-full text-left border-collapse">
            <thead>
                <tr>
                    <th class="border-b p-2">Name</th>
                    <th class="border-b p-2">Email</th>
                    <th class="border-b p-2">Phone</th>
                    <th class="border-b p-2">Status</th>
                </tr>
            </thead>
            <tbody id="leadsTableBody">
                <!-- Data populated by JS -->
            </tbody>
        </table>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    fetchLeads();

    document.getElementById('leadForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const data = {
            name: document.getElementById('leadName').value,
            email: document.getElementById('leadEmail').value,
            phone: document.getElementById('leadPhone').value,
            company: document.getElementById('leadCompany').value,
            status: 'New'
        };

        const res = await fetch('/api/leads', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        });
        if(res.ok) {
            e.target.reset();
            fetchLeads();
        } else {
            alert('Error creating lead');
        }
    });
});

async function fetchLeads() {
    const res = await fetch('/api/leads');
    const data = await res.json();
    const tbody = document.getElementById('leadsTableBody');
    tbody.innerHTML = '';
    
    if (data && data.length > 0) {
        data.forEach(lead => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="border-b p-2">${lead.name}</td>
                <td class="border-b p-2">${lead.email}</td>
                <td class="border-b p-2">${lead.phone}</td>
                <td class="border-b p-2">${lead.status}</td>
            `;
            tbody.appendChild(tr);
        });
    } else {
        tbody.innerHTML = '<tr><td colspan="4" class="p-2 text-center text-gray-500">No leads found.</td></tr>';
    }
}
</script>
{% endblock %}
