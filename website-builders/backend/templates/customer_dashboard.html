<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Project Portal - Website Builders</title>
  
  <link rel="stylesheet" href="/css/fontawesome.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      /* Colors */
      --primary: #0F766E;
      --primary-hover: #0D9488;
      --accent: #F59E0B;
      --bg-page: #F5F7F6;
      --bg-card: #FFFFFF;
      --text-main: #17211F;
      --text-secondary: #64706C;
      --border: #DCE5E2;
      
      /* Status */
      --status-new: #0284C7;
      --status-pending: #D97706;
      --status-progress: #0F766E;
      --status-completed: #16A34A;
      --status-failed: #DC2626;

      /* Shape */
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 18px;
      --shadow-subtle: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -1px rgba(0, 0, 0, 0.01);
      
      /* Typography */
      --font-stack: 'Inter', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: var(--font-stack);
      background-color: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
    }

    h1, h2, h3, h4, h5 { color: var(--text-main); font-weight: 700; }

    /* Layout */
    .sidebar {
      width: 250px;
      background: var(--bg-card);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      height: 100vh;
      z-index: 50;
    }

    .main-content {
      flex: 1;
      margin-left: 250px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Topbar */
    header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      height: 64px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 2rem;
      position: sticky;
      top: 0;
      z-index: 40;
    }

    /* Sidebar Logo & Nav */
    .sidebar-header {
      height: 64px;
      display: flex;
      align-items: center;
      padding: 0 1.5rem;
      border-bottom: 1px solid var(--border);
      font-weight: 800;
      font-size: 1.1rem;
      color: var(--primary);
      gap: 0.75rem;
      text-decoration: none;
    }

    .sidebar-nav {
      padding: 1.5rem 1rem;
      flex: 1;
      overflow-y: auto;
    }

    .nav-section {
      font-size: 0.75rem;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--text-secondary);
      letter-spacing: 0.5px;
      margin: 1.5rem 0 0.5rem 0.5rem;
    }
    .nav-section:first-child { margin-top: 0; }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.6rem 0.75rem;
      color: var(--text-secondary);
      text-decoration: none;
      border-radius: var(--radius-sm);
      font-weight: 500;
      font-size: 0.9rem;
      transition: all 0.2s ease;
      margin-bottom: 0.15rem;
    }

    .nav-link:hover {
      background: var(--bg-page);
      color: var(--text-main);
    }

    .nav-link.active {
      background: var(--primary);
      color: #FFFFFF;
      font-weight: 600;
    }
    
    .nav-link i { width: 20px; text-align: center; }

    /* Topbar Components */
    .search-box {
      display: flex;
      align-items: center;
      background: var(--bg-page);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.4rem 0.75rem;
      width: 300px;
      color: var(--text-secondary);
    }
    .search-box input {
      border: none;
      background: transparent;
      outline: none;
      margin-left: 0.5rem;
      width: 100%;
      font-family: var(--font-stack);
      font-size: 0.85rem;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .btn-icon {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 1.1rem;
      cursor: pointer;
      position: relative;
    }
    .btn-icon:hover { color: var(--text-main); }
    .notif-dot {
      position: absolute;
      top: -2px;
      right: -2px;
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
    }

    .user-profile { display: flex; align-items: center; gap: 0.75rem; }
    .user-avatar { width: 36px; height: 36px; border-radius: 50%; }
    .user-meta { text-align: right; }
    .user-name { font-size: 0.85rem; font-weight: 600; }
    .user-role { font-size: 0.7rem; font-weight: 500; color: var(--text-secondary); }

    /* Content Area */
    .content-area { padding: 2rem; }
    
    .page-title { font-size: 1.75rem; margin-bottom: 1.5rem; }

    /* Cards */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-subtle);
      padding: 1.5rem;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
    }
    .card-title { font-size: 1.1rem; font-weight: 700; }

    /* Projects Grid */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }
    
    .project-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      transition: all 0.2s ease;
    }
    .project-card:hover {
      border-color: rgba(15, 118, 110, 0.3);
      box-shadow: var(--shadow-subtle);
      transform: translateY(-2px);
    }
    .project-card h3 { font-size: 1.2rem; margin-bottom: 0.25rem; }

    /* Buttons */
    .btn {
      padding: 0.5rem 1rem;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
      border: 1px solid transparent;
      text-decoration: none;
    }
    .btn-primary { background: var(--primary); color: #FFFFFF; }
    .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }
    .btn-secondary { background: var(--bg-card); color: var(--primary); border-color: var(--primary); }
    .btn-secondary:hover { background: rgba(15, 118, 110, 0.05); }
    
    /* Progress Bar */
    .progress-container { width: 100%; height: 8px; background: var(--border); border-radius: 99px; overflow: hidden; margin-top: 0.5rem; }
    .progress-fill { height: 100%; background: var(--primary); border-radius: 99px; transition: width 0.5s ease; }
    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 0.25rem;
    }
    
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <a href="/index.html" class="sidebar-header" style="gap: 0.75rem; text-decoration: none; display: flex; align-items: center; padding: 1.25rem 1.5rem;">
      <img src="/images/logo.png" alt="Website Builders Logo" style="height: 36px; width: auto; object-fit: contain;">
      <span style="font-size: 1.15rem; font-weight: 800; color: #FFFFFF; letter-spacing: -0.02em;">Website <span style="color: #60A5FA;">Builders</span></span>
    </a>
    <nav class="sidebar-nav">
      <div class="nav-section">My Portal</div>
      <a href="#" class="nav-link active" onclick="switchTab('dashboard')" id="tab-dashboard"><i class="fa-solid fa-house"></i> Home</a>
      <a href="#" class="nav-link" onclick="switchTab('projects')" id="tab-projects"><i class="fa-solid fa-folder-open"></i> Projects</a>
      <a href="#" class="nav-link" onclick="switchTab('invoices')" id="tab-invoices"><i class="fa-solid fa-file-invoice-dollar"></i> Billing</a>

      <div class="nav-section">Support</div>
      <a href="#" class="nav-link" onclick="switchTab('messages')" id="tab-messages"><i class="fa-solid fa-envelope"></i> Messages</a>
      <a href="#" class="nav-link" onclick="switchTab('files')" id="tab-files"><i class="fa-solid fa-file-arrow-up"></i> Files</a>

      <div style="margin-top: 2rem;">
        <a href="{{ url_for('profile') }}" class="nav-link"><i class="fa-solid fa-user-circle"></i> Profile</a>
        <a href="{{ url_for('logout') }}" class="nav-link" style="color: var(--status-failed);"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a>
      </div>
    </nav>
  </aside>

  <!-- Main Content -->
  <div class="main-content">
    
    <!-- Topbar -->
    <header>
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" placeholder="Search (Ctrl + K)...">
      </div>
      
      <div class="topbar-actions">
        <button class="btn-icon">
          <i class="fa-regular fa-bell"></i>
          <span class="notif-dot" style="background: var(--status-new);"></span>
        </button>
        
        <div class="user-profile">
          <div class="user-meta">
            <div class="user-name">{{ user.full_name }}</div>
            <div class="user-role">Client</div>
          </div>
          <img src="https://ui-avatars.com/api/?name={{ user.full_name }}&background=0F766E&color=fff" alt="Avatar" class="user-avatar">
        </div>
      </div>
    </header>

    <div class="content-area">
      <div id="section-dashboard">
        <h1 class="page-title">Welcome back, {{ user.full_name.split(' ')[0] }}</h1>
        
        <h2 style="font-size: 1.1rem; margin-bottom: 1rem; color: var(--text-secondary);">Your Projects</h2>
        <div class="projects-grid" id="client-projects-grid">
          <!-- Projects injected here -->
        </div>
      </div>
      
      <div id="section-placeholder" style="display: none;">
        <h1 class="page-title" id="placeholder-title">Section</h1>
        <div class="card">
          <p style="color: var(--text-secondary);">This section will display your module data.</p>
        </div>
      </div>

    </div>
  </div>

  <script>
    function switchTab(tabId) {
      document.querySelectorAll('.content-area > div').forEach(el => el.style.display = 'none');
      document.querySelectorAll('.sidebar-menu a, .sidebar-nav a').forEach(el => el.classList.remove('active'));
      
      const tab = document.getElementById('tab-' + tabId);
      if (tab) tab.classList.add('active');
      
      const section = document.getElementById('section-' + tabId);
      if (section) {
        section.style.display = 'block';
        if (tabId === 'dashboard') fetchClientProjects();
      } else {
        document.getElementById('section-placeholder').style.display = 'block';
        document.getElementById('placeholder-title').innerText = tabId.charAt(0).toUpperCase() + tabId.slice(1);
      }
    }

    async function fetchClientProjects() {
      try {
        const res = await fetch('/api/projects');
        const data = await res.json();
        const grid = document.getElementById('client-projects-grid');
        grid.innerHTML = '';
        
        if (data.status === 'success') {
          if (data.data.length === 0) {
            grid.innerHTML = '<p style="color: var(--text-secondary);">You do not have any active projects yet.</p>';
            return;
          }
          data.data.forEach(p => {
            grid.innerHTML += `
              <div class="project-card">
                <div>
                  <div style="font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 0.25rem;">${p.project_id}</div>
                  <h3>${p.name}</h3>
                </div>
                
                <div class="progress-wrapper">
                  <div class="progress-label">
                    <span>${p.stage}</span>
                    <span>${p.progress}%</span>
                  </div>
                  <div class="progress-container">
                    <div class="progress-fill" style="width: ${p.progress}%;"></div>
                  </div>
                </div>
                
                <div style="display: flex; gap: 0.5rem; margin-top: 0.5rem;">
                  <button class="btn btn-secondary" style="flex: 1;"><i class="fa-solid fa-message"></i> Message Team</button>
                  <button class="btn btn-primary" style="flex: 1;"><i class="fa-solid fa-eye"></i> View</button>
                </div>
              </div>
            `;
          });
        }
      } catch (e) {
        console.error(e);
      }
    }

    fetchClientProjects();
  </script>
</body>
</html>
