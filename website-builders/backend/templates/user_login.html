<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enterprise IT Operations Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --deep-forest: #14532D;
      --primary-green: #15803D;
      --page-bg: #F7FAF8;
      --main-text: #14251B;
      --border-color: #D7E4DA;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--page-bg);
      color: var(--main-text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .notice-card {
      background: #FFFFFF;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 2.5rem;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(20,83,45,0.06);
    }
    h2 { margin-bottom: 0.75rem; color: var(--deep-forest); }
    p { margin-bottom: 1.5rem; color: #52635A; line-height: 1.5; font-size: 0.95rem; }
    .btn { display: inline-block; background: var(--primary-green); color: #FFF; padding: 0.75rem 1.5rem; border-radius: 6px; text-decoration: none; font-weight: 600; }
    .btn:hover { background: var(--deep-forest); }
  </style>
</head>
<body>
  <div class="notice-card">
    <h2>Enterprise Operations Portal</h2>
    <p>Client login is disabled on this platform. Super Admin, Admin, and Staff users should access the enterprise operations portal below.</p>
    <a href="/admin/login" class="btn">Proceed to Enterprise Portal Login</a>
  </div>
</body>
</html>
