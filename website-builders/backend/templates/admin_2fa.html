<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Two-Factor Authentication — Website Builders</title>
  <link rel="stylesheet" href="/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    :root {
      --primary: #0f172a;
      --accent: #10b981;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: #334155;
      margin: 0;
      padding: 1.5rem;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .auth-card {
      background: var(--card-bg);
      border-radius: 16px;
      max-width: 440px;
      width: 100%;
      padding: 2.5rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
      text-align: center;
    }
    .auth-icon {
      width: 56px;
      height: 56px;
      background: #ecfdf5;
      color: var(--accent);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
      margin: 0 auto 1.25rem;
    }
    .auth-card h1 {
      font-size: 1.5rem;
      color: var(--primary);
      margin: 0 0 0.5rem;
    }
    .auth-card p {
      color: #64748b;
      font-size: 0.95rem;
      margin: 0 0 1.75rem;
    }
    .code-inputs {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    .code-input {
      width: 48px;
      height: 56px;
      font-size: 1.5rem;
      font-weight: 700;
      text-align: center;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      background: #f8fafc;
      color: var(--primary);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .code-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
      background: #ffffff;
    }
    .btn-verify {
      width: 100%;
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 0.85rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-verify:hover {
      background: #1e293b;
    }
    .error-msg {
      color: #ef4444;
      font-size: 0.85rem;
      margin-top: 1rem;
      display: none;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="auth-icon"><i class="fas fa-shield-alt"></i></div>
    <h1>Two-Factor Authentication</h1>
    <p>Enter the 6-digit verification code from your Google Authenticator or TOTP app.</p>

    <form id="form-2fa" onsubmit="handleVerify(event)">
      <div class="code-inputs">
        <input type="text" maxlength="1" class="code-input" autofocus oninput="moveNext(this, 0)" onkeydown="handleBack(this, 0, event)">
        <input type="text" maxlength="1" class="code-input" oninput="moveNext(this, 1)" onkeydown="handleBack(this, 1, event)">
        <input type="text" maxlength="1" class="code-input" oninput="moveNext(this, 2)" onkeydown="handleBack(this, 2, event)">
        <input type="text" maxlength="1" class="code-input" oninput="moveNext(this, 3)" onkeydown="handleBack(this, 3, event)">
        <input type="text" maxlength="1" class="code-input" oninput="moveNext(this, 4)" onkeydown="handleBack(this, 4, event)">
        <input type="text" maxlength="1" class="code-input" oninput="moveNext(this, 5)" onkeydown="handleBack(this, 5, event)">
      </div>

      <button type="submit" id="btn-submit" class="btn-verify">Verify & Sign In</button>
      <div id="error-box" class="error-msg">Invalid verification code. Please try again.</div>
    </form>
  </div>

  <script>
    const inputs = document.querySelectorAll('.code-input');

    function moveNext(el, idx) {
      if (el.value.length === 1 && idx < inputs.length - 1) {
        inputs[idx + 1].focus();
      }
    }

    function handleBack(el, idx, e) {
      if (e.key === 'Backspace' && !el.value && idx > 0) {
        inputs[idx - 1].focus();
      }
    }

    async function handleVerify(e) {
      e.preventDefault();
      const code = Array.from(inputs).map(i => i.value).join('');
      if (code.length !== 6) {
        showError('Please enter all 6 digits.');
        return;
      }

      const btn = document.getElementById('btn-submit');
      btn.disabled = true;
      btn.textContent = 'Verifying...';
      document.getElementById('error-box').style.display = 'none';

      try {
        const res = await fetch('/api/admin/2fa/verify-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: code })
        });
        const data = await res.json();
        if (data.success) {
          window.location.href = data.redirect || '/admin/dashboard';
        } else {
          showError(data.error || 'Invalid 6-digit code. Please try again.');
          btn.disabled = false;
          btn.textContent = 'Verify & Sign In';
        }
      } catch (err) {
        showError('Network error. Please try again.');
        btn.disabled = false;
        btn.textContent = 'Verify & Sign In';
      }
    }

    function showError(msg) {
      const box = document.getElementById('error-box');
      box.textContent = msg;
      box.style.display = 'block';
    }
  </script>
</body>
</html>
